frequency: 30          # EKF update frequency
sensor_timeout: 0.1    # Timeout for sensor data
two_d_mode: true       # Use 2D mode for differential robots

odom0: /stretch_diff_drive_controller/odom # Input odometry topic
odom0_config: [true, true, false,  # x, y, z position
               false, false, false, # roll, pitch, yaw
               true, true, false,   # x, y, z velocity
               false, false, false] # roll, pitch, yaw velocity
odom0_queue_size: 5
odom0_differential: false
odom0_relative: false

imu0: /imu/data         # Input IMU topic
imu0_config: [false, false, false,  # x, y, z position
              false, false, true,   # roll, pitch, yaw
              false, false, false,  # x, y, z velocity
              true, true, true,     # roll, pitch, yaw velocity
              true, true, true]     # roll, pitch, yaw acceleration
imu0_queue_size: 5
imu0_remove_gravitational_acceleration: true

map_frame: map          # Map frame
odom_frame: odom        # Odometry frame
base_link_frame: base_link # Robot base frame
world_frame: map       # World frame to track (can be 'odom' or 'map')
publish_tf: true

