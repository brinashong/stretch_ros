# base_local_planner: "teb_local_planner/TebLocalPlannerROS"
base_local_planner: "eband_local_planner/EBandPlannerROS"

# # Base profile
# TrajectoryPlannerROS:
#   acc_lim_x: 1.0
#   acc_lim_y: 0.0
#   acc_lim_theta: 1.5
#   max_vel_x: 0.3
#   min_vel_x: -0.3
#   max_vel_y: 0.0
#   min_vel_y: 0.0
#   max_vel_theta: 0.7
#   min_vel_theta: -0.7
#   min_in_place_vel_theta: 0.3
#   escape_vel: -0.2
#   holonomic_robot: false
#   dwa: false
#
#   # Goal Tolerance Parameters
#   yaw_goal_tolerance: 0.05           # (5 degrees) The tolerance in radians for the controller in yaw/rotation when achieving its goal
#   xy_goal_tolerance: 0.05           # (10cm) The tolerance in meters for the controller in the x & y distance when achieving a goal
#   latch_xy_goal_tolerance: true    # If goal tolerance is latched, if the robot ever reaches the goal xy location it will simply rotate in place, even if it ends up outside the goal tolerance while it is doing so.
#
#
#   # forward simulation
#   sim_time: 1.7
#   sim_granularity: 0.025
#   angular_sim_granularity: 0.025
#   vx_samples: 10
#   vtheta_samples: 20
#
#   ## scoring (defaults)
#   meter_scoring: true
#   path_distance_bias: 5.0 # 3 # 0.5
#   goal_distance_bias: 5.0 #1.5 #0.75
#   occdist_scale: 0.02 #0.00625
#
#   pdist_scale: 5.0
#   gdist_scale: 5.0
#   occdist_scale: 0.01
#
#   heading_lookahead: 0.325
#   heading_scoring_timestep: 0.8
#   heading_scoring: true

TebLocalPlannerROS:
  teb_autosize: true
  dt_ref: 0.3
  dt_hysteresis: 0.1
  max_global_plan_lookahead_dist: 3.0
  min_obstacle_dist: 0.1
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0
  max_vel_x: 0.2
  max_vel_x_backwards: 0.07
  max_vel_theta: 0.3
  acc_lim_x: 1.0
  acc_lim_theta: 1.0
  # footprint_model:
  #   type: "polygon"
  #   vertices: [[-0.5, -0.5], [0.5, -0.5], [0.5, 0.5], [-0.5, 0.5]]
  weight_optimaltime: 1.0
  weight_max_vel_x: 2.0
  weight_max_vel_theta: 1.0
  weight_acc_lim_x: 1.0
  weight_acc_lim_theta: 1.0
  weight_kinematics_turning_radius: 0.0
  weight_obstacle: 50.0
  xy_goal_tolerance: 0.01
  yaw_goal_tolerance: 0.005

EBandPlannerROS:
  # TRAJECTORY CONTROL
  differential_drive: true

  # velocity limits, tune for new robot
  max_vel_lin: 0.8
  max_vel_th: 0.6
  min_vel_lin: 0.005
  min_in_place_vel_th: 0.0025

  # goal tolerance
  xy_goal_tolerance: 0.01
  yaw_goal_tolerance: 0.005

  # angular velocity PID
  k_prop: 1.01 #1.0 #0.9 #0.75
  k_damp: 1.3 #1.3 #0.65

  max_acceleration: 0.2
  virtual_mass: 2.24 #3.0 # 2.5

  #eband parameters

  # optimization - force calculation
  eband_internal_force_gain: 1.1 #1.1
  # default 2.0
  eband_external_force_gain: 0.9
  num_iterations_eband_optimization: 2

  # recursive approximation of bubble equilibrium position based
  eband_equilibrium_approx_max_recursion_depth: 3
  eband_equilibrium_relative_overshoot: 0.8
  eband_significant_force_lower_bound: 0.15
