controller_list:
  - name: fake_stretch_arm_controller
    type: $(arg fake_execution_type)
    joints:
      - joint_lift
      - joint_arm_l3
      - joint_arm_l2
      - joint_arm_l1
      - joint_arm_l0
      - joint_wrist_yaw
  - name: fake_stretch_gripper_controller
    type: $(arg fake_execution_type)
    joints:
      - finger_joint
  - name: fake_stretch_head_controller
    type: $(arg fake_execution_type)
    joints:
      - joint_head_pan
      - joint_head_tilt
initial:  # Define initial robot poses per group
  - group: stretch_arm
    pose: home_low
  - group: stretch_gripper
    pose: open
  - group: stretch_head
    pose: home
